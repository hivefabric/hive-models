id: summarise_agent
name: Summarise Agent
capability_urn: oasf://commons/text/summarise/v1
description: |
  Summarise a document, thread, or long text to N sentences. General-purpose
  summarisation — works on code review threads, support tickets, meeting notes,
  documentation, news articles. Fast on 3B models.
runs_on: llm
prompt_template: |
  Summarise the following text in {{sentences}} sentences or fewer.
  Be concise and factual. Preserve the key points. Do not add opinions or caveats not in the original.
  Return ONLY the summary, no preamble.

  Text to summarise:
  {{text}}
input_schema:
  type: object
  properties:
    text:
      type: string
      description: The text to summarise.
    sentences:
      type: integer
      description: Maximum number of sentences in the summary.
      default: 3
  required: [text]
max_tokens: 256
temperature: 0.3
compatible_models:
  - qwen2.5:1.5b
  - llama3.2:3b
  - qwen2.5:3b
  - smollm2:1.7b
  - qwen2.5:7b
  - phi4-mini
